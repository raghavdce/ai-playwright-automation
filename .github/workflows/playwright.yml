name: Playwright + Security Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Playwright Functional Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # -------------------------------
      # Checkout
      # -------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------
      # Node setup
      # -------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # -------------------------------
      # Install deps
      # -------------------------------
      - name: Install dependencies
        run: npm ci

      # -------------------------------
      # Install browsers
      # -------------------------------
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # -------------------------------
      # Run Playwright tests
      # -------------------------------
      - name: Run Playwright tests
        run: npx playwright test
        continue-on-error: true

      # -------------------------------
      # Send result to n8n (SAFE)
      # -------------------------------
      - name: Send Playwright result to n8n
        if: always()
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_PLAYWRIGHT_WEBHOOK }}
        run: |
          if [ -z "$N8N_WEBHOOK_URL" ]; then
            echo "N8N webhook not configured. Skipping."
            exit 0
          fi

          if [ ! -f playwright-results.json ]; then
            echo "Playwright JSON report not found. Sending fallback payload."
            curl -X POST "$N8N_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"status\":\"completed\",\"runId\":\"${GITHUB_RUN_ID}\",\"note\":\"No playwright-results.json\"}"
            exit 0
          fi

          curl -X POST "$N8N_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data-binary @playwright-results.json

      # -------------------------------
      # Upload Playwright HTML report
      # -------------------------------
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # =====================================================
  # SECURITY SCAN
  # =====================================================
  security-scan:
    name: OWASP ZAP Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: https://www.saucedemo.com
          fail_on_alert: false

      - name: Upload ZAP Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-report
          path: |
            report_html.html
            report_md.md
            report_json.json
          retention-days: 30
