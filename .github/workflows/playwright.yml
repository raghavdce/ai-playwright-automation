name: Playwright + Security Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Playwright Functional Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      # ✅ Send Playwright JSON result to n8n
      - name: Send Playwright result to n8n
        if: always()
        env:
          N8N_PLAYWRIGHT_WEBHOOK: ${{ secrets.N8N_PLAYWRIGHT_WEBHOOK }}
        run: |
          if [ -z "$N8N_PLAYWRIGHT_WEBHOOK" ]; then
            echo "N8N webhook not configured. Skipping."
            exit 0
          fi

          if [ ! -f playwright-report.json ]; then
            echo "playwright-report.json not found. Skipping."
            exit 0
          fi

          curl -X POST "$N8N_PLAYWRIGHT_WEBHOOK" \
            -H "Content-Type: application/json" \
            --data-binary @playwright-report.json

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  security-scan:
    name: OWASP ZAP Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🔒 FINAL FIX — CLASSIC ZAP ENGINE (NO AUTOMATION FRAMEWORK)
      - name: Run OWASP ZAP Scan (Stable Mode)
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: https://www.saucedemo.com
          cmd_options: >
            -J report_json.json
            -w report_md.md
            -r report_html.html
            -d

      - name: Upload ZAP Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-report
          path: |
            report_html.html
            report_md.md
            report_json.json
          retention-days: 30
