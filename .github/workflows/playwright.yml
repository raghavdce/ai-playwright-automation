name: AI Playwright + Security Pipeline

on:
  push:
    paths:
      - 'tests/**'

  workflow_dispatch:

jobs:
  test:
    name: Playwright Functional Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    outputs:
      test_status: ${{ steps.test_execution.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        id: test_execution
        run: npx playwright test

      - name: Send Playwright result to n8n
        if: always()
        env:
          N8N_PLAYWRIGHT_WEBHOOK: ${{ secrets.N8N_PLAYWRIGHT_WEBHOOK }}
        run: |
          if [ -z "$N8N_PLAYWRIGHT_WEBHOOK" ]; then
            echo "N8N webhook not configured. Skipping."
            exit 0
          fi

          if [ ! -f playwright-report.json ]; then
            echo "playwright-report.json not found. Skipping."
            exit 0
          fi

          curl -X POST "$N8N_PLAYWRIGHT_WEBHOOK" \
            -H "Content-Type: application/json" \
            --data-binary @playwright-report.json

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          retention-days: 5

  security-scan:
    name: OWASP ZAP Security Scan
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OWASP ZAP Scan
        continue-on-error: true
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: https://www.saucedemo.com
          cmd_options: >
            -J zap-report.json
            -w zap-report.md
            -r zap-report.html
            -d

      - name: Upload ZAP Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-report-${{ github.run_number }}
          path: |
            zap-report.html
            zap-report.md
            zap-report.json
          retention-days: 5
